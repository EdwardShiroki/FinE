apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fine-backend
  namespace: fine
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fine-backend
  minReplicas: 1
  # HPA requires a finite upper bound, so keep it practically unbounded.
  maxReplicas: 1000
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      selectPolicy: Max
      policies:
        - type: Pods
          value: 2
          periodSeconds: 30
        - type: Percent
          value: 100
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 60
      selectPolicy: Max
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
        - type: Percent
          value: 50
          periodSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
