apiVersion: apps/v1
kind: Deployment
metadata:
  name: fine-backend
  namespace: fine
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: fine-backend
  template:
    metadata:
      labels:
        app: fine-backend
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z postgres 5432; do sleep 2; done"]
        - name: wait-for-redis
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z redis 6379; do sleep 2; done"]
      containers:
        - name: fine-backend
          image: registry:5000/fine-backend:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: fine-app-config
            - secretRef:
                name: fine-app-secret
          ports:
            - containerPort: 8000
              name: http
          readinessProbe:
            httpGet:
              path: /login/
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          startupProbe:
            httpGet:
              path: /login/
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "3"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: fine-backend
  namespace: fine
spec:
  type: NodePort
  selector:
    app: fine-backend
  ports:
    - port: 80
      targetPort: http
      nodePort: 30081
