apiVersion: batch/v1
kind: Job
metadata:
  name: fine-backend-bootstrap
  namespace: fine
spec:
  backoffLimit: 4
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app: fine-backend-bootstrap
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z postgres 5432; do sleep 2; done"]
        - name: wait-for-redis
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z redis 6379; do sleep 2; done"]
      containers:
        - name: migrate
          image: registry:5000/fine-backend:latest
          imagePullPolicy: Always
          command: ["python3", "manage.py", "migrate", "--noinput"]
          envFrom:
            - configMapRef:
                name: fine-app-config
            - secretRef:
                name: fine-app-secret
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
